name: NumberBook IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project location
        run: |
          pwd
          ls -la
          find . -name "*.xcodeproj" -print

      - name: Inspect project
        run: |
          PROJECT=$(find . -name "NumberBookIOS.xcodeproj" -print -quit)
          echo "Project path: $PROJECT"
          test -n "$PROJECT"
          xcodebuild -list -project "$PROJECT"
