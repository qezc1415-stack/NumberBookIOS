name: NumberBook IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          find . -name "*.xcodeproj" -print

      - name: Build IPA
        run: |
          PROJECT=$(find . -name "NumberBookIOS.xcodeproj" -print -quit)
          xcodebuild -list -project "$PROJECT"
