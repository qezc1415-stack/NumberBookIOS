name: Build NumberBook IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o NumberBookIOS_starter.zip -d project

      - name: Find Xcode project
        run: find project -name "*.xcodeproj"
