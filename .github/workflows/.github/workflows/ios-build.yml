
name: NumberBook IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          echo "Searching for Xcode project..."
          find . -name "*.xcodeproj" -print
          echo "Repository files:"
          find . -maxdepth 5 -print

      - name: Show Xcode schemes
        run: |
          PROJECT=$(find . -name "NumberBookIOS.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi
          xcodebuild -list -project "$PROJECT"
