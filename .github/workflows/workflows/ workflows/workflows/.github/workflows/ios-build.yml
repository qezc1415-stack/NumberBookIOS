name: Build NumberBook IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: List files
        run: ls -la
